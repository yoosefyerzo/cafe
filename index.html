<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>کافه گیم نئو</title><style>
:root{--bg:#faf6f0;--card:#ffffff;--tx:#2b211a;--ac:#8b5a2b;--bd:#e6dccf;--mut:#8a7a6c;--ok:#2f7d4f;--no:#b3382c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg) center/cover fixed;color:var(--tx);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;line-height:1.7}
#app{max-width:720px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
.hd{text-align:center}
.logo{width:90px;height:90px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 6px}
h1{margin:4px 0;font-size:1.9em;color:var(--ac)}
h2{margin:0 0 6px;font-size:1.15em;color:var(--ac);border-bottom:2px solid var(--bd);padding-bottom:4px}
.it{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--bd)}
.it:last-child{border:0}
.it img{width:72px;height:72px;border-radius:10px;object-fit:cover;flex:none}
.it .m{flex:1;min-width:0}.it small{color:var(--mut)}
.price{font-weight:700;color:var(--ac);white-space:nowrap}
.badge{font-size:.75em;padding:1px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.ok{color:var(--ok)}.no{color:var(--no)}
.txt{white-space:pre-wrap}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-size:.9em;border:0;border-radius:9px;padding:6px 12px;background:var(--ac);color:#fff;cursor:pointer}
button.s{background:transparent;color:var(--tx);border:1px solid var(--bd);padding:4px 9px}
button.g{background:transparent;color:var(--no);border:1px solid var(--no);padding:4px 9px}
button:disabled{opacity:.5}
input,textarea,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:5px 8px;min-width:0;box-sizing:border-box}
input[type=color]{padding:0;width:44px;height:30px}
textarea{width:100%;min-height:70px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.w{grid-column:1/-1}
.lbl{font-size:.75em;color:var(--mut);display:block}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0}
.msg{color:var(--mut);font-size:.85em}
.blk{outline:2px dashed var(--bd);outline-offset:3px}

:root{--bg:#faf6f0;--card:#ffffff;--tx:#2b211a;--ac:#8b5a2b}html{font-size:16px}


.stp{display:flex;align-items:center;gap:8px;margin-top:4px}
.stp button{width:30px;height:30px;padding:0;font-size:1.1em;border-radius:50%}
.stp b{min-width:1.5em;text-align:center}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:none;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd);box-shadow:0 -4px 14px rgba(0,0,0,.12)}
#bar button{width:100%;padding:12px;font-size:1.05em}
#ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center}
#pn{background:var(--card);color:var(--tx);width:100%;max-width:720px;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
#pn input,#pn textarea{width:100%;margin:4px 0 10px}
#pn .ln{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed var(--bd)}
#pn .r{display:flex;gap:8px}#pn .r button{flex:1;padding:10px}
#app{padding-bottom:90px}
</style></head><body><div id="app"></div><div id="bar"><button type="button"></button></div><div id="ov"><div id="pn"></div></div>
